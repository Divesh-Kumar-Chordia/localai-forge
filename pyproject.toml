[project]
name = "localai-forge"
version = "0.1.0"
description = "Private, fully local RAG + agent platform (Ollama, FastAPI, Chroma, SQLite) with a glass-box UI"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "langgraph>=1.2.15",
    "ollama>=0.6.3",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pypdf>=6.21.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.1.0",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
