name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install deps (locked)
        run: uv sync --locked
      - name: Unit tests (deterministic, no LLM needed)
        run: uv run pytest -q
      - name: Frontend syntax
        run: node --check web/app.js && node --check web/md.js
